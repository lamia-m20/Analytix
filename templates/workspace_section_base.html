{% load static %}
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>{% block title %}Analytix{% endblock %}</title><link rel="stylesheet" href="{% static 'css/home-workspace.css' %}"><style>
.section-content{padding:44px;width:min(1180px,100%);margin:auto}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.section-heading h1{margin:0;color:#75a0ff}.section-heading p,.muted{color:#aebbd2}.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}.section-card,.empty-state{padding:24px;border:1px solid rgba(104,151,255,.22);border-radius:18px;background:rgba(11,25,47,.95);color:#fff}.section-card h2{margin-top:0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.action{display:inline-block;padding:10px 14px;border:0;border-radius:9px;color:#fff;text-decoration:none;background:#356ee8;cursor:pointer}.action.soft{background:#172b4c}.empty-state{text-align:center}.settings-form{display:grid;gap:15px;max-width:700px}.settings-form label{display:grid;gap:7px;color:#cbd7ec}.settings-form input{padding:12px;border:1px solid rgba(104,151,255,.3);border-radius:9px;color:#fff;background:#0a172b}.facts{display:grid;gap:10px;margin:18px 0}.facts span{color:#aebbd2}.facts b{color:#fff}@media(max-width:760px){.section-content{padding:24px 18px}.section-heading{align-items:flex-start;flex-direction:column}}
</style></head><body class="home-workspace-page"><div class="workspace-shell">{% include 'includes/workspace_sidebar.html' %}<div class="workspace-overlay" id="workspace-overlay"></div><main class="workspace-main"><button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="فتح القائمة" aria-expanded="false">☰</button><div class="section-content">{% block content %}{% endblock %}</div></main></div><script src="{% static 'js/home-workspace.js' %}" defer></script></body></html>

{% extends "accounts-templates/password_reset_base.html" %}
{% block content %}
    <h1>نسيت كلمة المرور؟</h1>
    <p>أدخل البريد الإلكتروني المرتبط بحسابك وسنرسل لك رابطًا لتعيين كلمة مرور جديدة.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}">البريد الإلكتروني</label>
        <input
            type="email"
            name="email"
            id="{{ form.email.id_for_label }}"
            autocomplete="email"
            placeholder="example@email.com"
            required
        >
        <button type="submit">إرسال رابط الاستعادة</button>
    </form>
    <a class="back" href="{% url 'accounts:login' %}">العودة إلى تسجيل الدخول</a>
{% endblock %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}استعادة كلمة المرور{% endblock %} | Analytix</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #182033;
            background:
                radial-gradient(circle at top left, rgba(91,95,242,.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(16,181,166,.14), transparent 32%),
                #f4f7fc;
            font-family: Tahoma, Arial, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 500px;
            padding: 38px;
            border: 1px solid #dfe5ef;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(33,47,78,.14);
        }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { margin: 0 0 22px; color: #6f7890; line-height: 1.8; }
        label { display: block; margin: 18px 0 8px; font-weight: bold; }
        input {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            border: 1px solid #dfe5ef;
            border-radius: 13px;
            font: inherit;
        }
        input:focus { outline: 2px solid rgba(91,95,242,.25); border-color: #5b5ff2; }
        button, .button {
            display: block;
            width: 100%;
            min-height: 52px;
            margin-top: 22px;
            padding: 15px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, #5b5ff2, #4145c9);
            font: inherit;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .back { display: block; margin-top: 18px; color: #5b5ff2; text-align: center; text-decoration: none; }
        .errorlist { padding: 12px 28px 12px 12px; border-radius: 10px; color: #d9363e; background: rgba(217,54,62,.08); }
        .helptext { display: block; margin-top: 8px; color: #6f7890; font-size: 13px; line-height: 1.6; }
        ul { line-height: 1.7; }
    </style>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/analytix-fabric.css' %}">
</head>
<body>
    <main class="card">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
